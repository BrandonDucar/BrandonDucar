name: Public directory checks
on:
  push:
    paths: ['docs/**', 'scripts/**', '.github/**', '*.md']
  pull_request:
    paths: ['docs/**', 'scripts/**', '.github/**', '*.md']
permissions:
  contents: read
jobs:
  directory:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node scripts/check-directory.mjs
      - run: node --test scripts/visitor-paths.test.mjs
      - run: node scripts/build-directory.mjs
      - run: git diff --exit-code -- docs
